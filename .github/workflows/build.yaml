name: Build

on:
  push:
  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            checks: write
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
                  cache: maven
            - name: Check formatting
              run: ./mvnw spotless:check
              working-directory: java-example-01
            - name: Compile
              run: ./mvnw compile -Dspotless.check.skip
              working-directory: java-example-01
            - name: Run tests
              run: ./mvnw test -Dspotless.check.skip
              working-directory: java-example-01
            - name: Publish test results
              uses: dorny/test-reporter@b082adf0eced0765477756c2a610396589b8c637 # v2.5.0
              if: always()
              with:
                  name: Tests
                  path: java-example-01/target/surefire-reports/*.xml
                  reporter: java-junit
            - name: Publish coverage report
              uses: PavanMudigonda/jacoco-reporter@v5.0
              with:
                  coverage_results_path: java-example-01/target/site/jacoco/jacoco.xml
                  coverage_report_name: Coverage
                  coverage_report_title: JaCoCo Coverage
                  github_token: ${{ secrets.GITHUB_TOKEN }}
